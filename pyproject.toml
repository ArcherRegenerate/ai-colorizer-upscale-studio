[project]
name = "ai-colorizer-upscale-studio"
version = "0.9.4"
description = "AI coloring and upscaling studio — colorize B&W photos, upscale low-res images, batch-enhance with ONNX/TensorRT backends."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "upscale-studio maintainers", email = "dev@colorizer-upscale.studio" }]
keywords = ["ai", "colorization", "upscaling", "super-resolution", "onnx", "tensorrt", "image-enhancer"]

dependencies = [
    "PySide6>=6.7.0",
    "numpy>=1.26.4",
    "opencv-python>=4.10.0.84",
    "onnxruntime-gpu>=1.18.1",
    "Pillow>=10.4.0",
    "pydantic>=2.8.2",
    "loguru>=0.7.2",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "platformdirs>=4.2.2",
]

[project.optional-dependencies]
tensorrt = ["tensorrt>=10.2.0", "pycuda>=2024.1"]
dev = ["pytest>=8.3.2", "pytest-qt>=4.4.0", "ruff>=0.5.6", "mypy>=1.11.0", "black>=24.8.0"]

[project.scripts]
colorizer-studio = "app.bootstrap.cli:main"
colorizer-gui = "app.bootstrap.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true